version: 2
updates:
  # SPM packages declared in Nextcloud.xcodeproj (NextcloudKit, Realm, Firebase, …)
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      swift-packages:
        patterns:
          - "*"
    # These deps are ignored, since they are internal Firebase and Realm libs.
    # They have their own version limits that may not be the latest version, which forces XCode to reverse a version change.
    # Since these are ignored, the only way they update is through an Xcode package build, which will happen naturally.
    ignore:
      - dependency-name: "github.com/google/*"
      - dependency-name: "github.com/googleads/*"
      - dependency-name: "github.com/firebase/nanopb"
      - dependency-name: "github.com/firebase/leveldb"
      - dependency-name: "github.com/realm/realm-core"
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps)"

  # Keep the GitHub Actions used by our workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
