version: 2
updates:
  # SPM packages declared in Nextcloud.xcodeproj (NextcloudKit, Realm, Firebase, …)
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      swift-packages:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps)"

  # Keep the GitHub Actions used by our workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
